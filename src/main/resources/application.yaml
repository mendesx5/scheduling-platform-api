spring:
  application:
    name: scheduling-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scheduling}
    username: ${DB_USERNAME:scheduling}
    password: ${DB_PASSWORD:scheduling}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-bytes}
    expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
