spring:
  application:
    name: scheduling-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/scheduling}
    username: ${DB_USERNAME:scheduling}
    password: ${DB_PASSWORD:scheduling}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:never}
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  rate-limit:
    auth-per-minute: ${RATE_LIMIT_AUTH:10}
    bookings-per-minute: ${RATE_LIMIT_BOOKINGS:20}
    window-seconds: 60
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:auto}
    bucket: ${STORAGE_BUCKET:scheduling-platform-uploads}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html